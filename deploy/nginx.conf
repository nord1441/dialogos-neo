# nginx site config for dialogos-neo. Drop into /etc/nginx/sites-available/
# and symlink from sites-enabled. Uses certbot for TLS (assumed pre-issued).

upstream chatapp_upstream {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name chat.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;

    client_max_body_size 16m;   # uploads cap; matches MAX_BYTES * 2 buffer

    # Optional: HTTP Basic auth for the browser UI.
    # auth_basic "chatapp";
    # auth_basic_user_file /etc/nginx/.htpasswd;
    # location /api/ { auth_basic off; }
    # location /healthz { auth_basic off; }

    location / {
        proxy_pass http://chatapp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical for SSE: do not buffer streaming responses.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }
}
